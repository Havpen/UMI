name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://havpen.github.io/UMI
        run: |
          mv app/api /tmp/umi-api
          npm run build
          mv /tmp/umi-api app/api
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST /repos/${{ github.repository }}/pages \
            -f build_type=workflow \
            -F "source[branch]=main" \
            -F "source[path]=/" || true
      - id: deployment
        uses: actions/deploy-pages@v4
